<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      margin: 0;
      background: #fff;
      color: #333;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 8px;
    }
    p {
      font-size: 13px;
      color: #666;
      margin: 0 0 16px;
      line-height: 1.4;
    }
    .upgrade-btn {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }
    .upgrade-btn:hover {
      background: #1d4ed8;
    }
    .thanks {
      font-size: 11px;
      color: #999;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <h1>PC Queue is now part of CardScout</h1>
  <p>Queue tracking and much more is available in the CardScout extension.</p>
  <a class="upgrade-btn" href="https://cardscout.co" target="_blank">Check out CardScout</a>
  <p class="thanks">Thanks for using PC Queue!</p>
</body>
</html>
